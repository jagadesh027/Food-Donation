<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor - Food Donation System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
        }
        .donor-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            text-align:left;
            box-sizing: border-box;
        }
        .donor-container h1 {
            margin-bottom: 20px;
            font-size: 32px;
            color: #333;
        }
        .donor-container p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        .donor-container form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .donor-container form label {
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .donor-container form input,
        .donor-container form textarea {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .donor-container form button {
            padding: 12px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .donor-container form button:hover {
            background-color: #45a049;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .donor-container {
                padding: 30px;
                max-width: 90%;
            }
            .donor-container h1 {
                font-size: 28px;
            }
            .donor-container p {
                font-size: 14px;
            }
            .donor-container form label {
                font-size: 12px;
            }
            .donor-container form input,
            .donor-container form textarea {
                font-size: 14px;
                padding: 10px;
            }
            .donor-container form button {
                font-size: 14px;
                padding: 10px 15px;
            }
        }
        
        @media (max-width: 480px) {
            .donor-container {
                padding: 20px;
                max-width: 100%;
            }
            .donor-container h1 {
                font-size: 24px;
            }
            .donor-container p {
                font-size: 12px;
            }
            .donor-container form input,
            .donor-container form textarea {
                font-size: 12px;
                padding: 8px;
            }
            .donor-container form button {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="donor-container">
        <h1>Donor Instructions</h1>
        <p>Please fill out the form below to donate food. Make sure to provide accurate details to help us distribute the food efficiently.</p>
        <form th:action="@{/donor}" th:object="${donor}" method="POST">
            <label for="donor_name">Donor Name</label>
            <input type="text" th:field="*{donorName}" placeholder="Donor Name" required>
            
            <label for="food_category">Food Category</label>
            <input type="text" th:field="*{foodCategory}" placeholder="Food Category" required>
            
            <label for="food_desc">Food Description</label>
            <textarea th:field="*{foodDesc}" placeholder="Food Description" rows="4" required></textarea>
            
            <label for="quantity">Quantity</label>
            <input type="number" th:field="*{quantity}" placeholder="Quantity" required>
            
            <label for="expiry_date">Expiry Date</label>
            <input type="date" th:field="*{expiryDate}" required>
            
            <label for="address">Address</label>
            <input type="text" th:field="*{address}" placeholder="Address" required>
            
            <label for="city">City</label>
            <input type="text" th:field="*{city}" placeholder="City" required>
            
            <label for="contact_number">Contact Number</label>
            <input type="tel" th:field="*{contactNumber}" placeholder="Contact Number" required>
            
            <!-- Donor Email Field -->
            <label for="email">Donor Email</label>
            <input type="email" th:field="*{email}" placeholder="Donor Email" required>
            
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
